name: 509.rip deployment

# Deployment is managed by the 509.rip GitHub integration.
# This workflow is intentionally manual-only so it cannot launch the obsolete
# SSH deployment path or create duplicate production deployments.
on:
  workflow_dispatch:
    inputs:
      note:
        description: "Optional deployment note"
        required: false
        type: string

permissions:
  contents: read

jobs:
  provider-deployment-info:
    name: Confirm provider-managed deployment
    runs-on: ubuntu-latest
    steps:
      - name: Report deployment owner
        run: |
          echo "Production deployment is managed by the 509.rip GitHub integration."
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit: $GITHUB_SHA"
          echo "Use the 509.rip deployment logs to monitor build and health checks."
