name: Deploy to invoice-bin-zoma.arabcord.com

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Sync files to remote server
        run: |
          set -e
          echo "Host: ${{ secrets.SSH_HOST }}"
          echo "User: ${{ secrets.SSH_USER }}"
          echo "Path: ${{ secrets.DEPLOY_PATH }}"
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '.env' \
            -e "ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30" \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}"

      - name: Build and restart Docker container
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          MASTER_PASSWORD: ${{ secrets.MASTER_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GPS_USER: ${{ secrets.GPS_USER }}
          GPS_PASS: ${{ secrets.GPS_PASS }}
          GPS_TOKEN: ${{ secrets.GPS_TOKEN }}
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << EOF
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose down 2>/dev/null || docker-compose down 2>/dev/null || true
            docker ps -aq --filter "name=invoice-bin-zoma" | xargs -r docker rm -f 2>/dev/null || true
            # free common app ports
            docker ps -q --filter "publish=5000" | xargs -r docker rm -f 2>/dev/null || true
            docker ps -q --filter "publish=3000" | xargs -r docker rm -f 2>/dev/null || true
            docker build -t invoice-bin-zoma .
            docker run -d --name invoice-bin-zoma --restart always \
              -p 5000:5000 \
              -e PORT=5000 \
              -e SECRET_KEY="${SECRET_KEY}" \
              -e MASTER_PASSWORD="${MASTER_PASSWORD}" \
              -e DATABASE_URL="${DATABASE_URL}" \
              -e GPS_USER="${GPS_USER}" \
              -e GPS_PASS="${GPS_PASS}" \
              -e GPS_TOKEN="${GPS_TOKEN}" \
              invoice-bin-zoma
            sleep 3
            docker ps --filter "name=invoice-bin-zoma"
            docker logs --tail 30 invoice-bin-zoma || true
          EOF
