<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>تقرير الموظفين كامل</title>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/page/employee_report_template.css', v=1) }}">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="report-container">
    <a href="/employees" class="btn-back">🔙 العودة لشاشة الموظفين</a>
    <h1>تقرير الموظفين الشامل ({{ employees|length }} موظف)</h1>
    <table id="employees" class="display nowrap csp-inline-employee-report-template-163">
      <thead>
        <tr>
          {% for col in columns %}
            <th{% if col == 'م' %} class="sticky-col"{% endif %}>{{ col }}</th>
          {% endfor %}
        </tr>
      </thead>
      <tbody>
        {% for emp in employees %}
          <tr>
            {% for col in columns %}
              <td{% if col == 'م' %} class="sticky-col"{% endif %}>{{ emp[col] }}</td>
            {% endfor %}
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script>
    .ready(function(){
      #employees.DataTable({
        scrollX: true,
        fixedHeader: true,
        pageLength: 25,
        language: { url: "https://cdn.datatables.net/plug-ins/1.13.6/i18n/ar.json" }
      });
    });
  </script>
</body>
</html>
