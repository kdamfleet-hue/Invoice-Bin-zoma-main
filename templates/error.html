{% extends 'base.html' %}
{% block title %}إشعار الخدمة | شركة بن زومة{% endblock %}

{% block content %}
<div class="glass-panel" style="max-width: 600px; margin: 80px auto; padding: 40px; text-align: center; border-radius: 20px;">
    <div style="font-size: 4rem; margin-bottom: 20px;">⚠️</div>
    <h2 style="color: var(--gold-primary); font-family: 'Cairo', sans-serif; font-size: 1.8rem; margin-top: 0;">
        إشعار تحديث أو استجابة سيرفر
    </h2>
    <p style="color: var(--text-muted); line-height: 1.8; margin-bottom: 30px; font-size: 1rem;">
        جارٍ تحديث استجابة السيرفر وتطبيق التحديثات الأخيرة على الصفحة. يمكنك العودة إلى الصفحة الرئيسية أو إعادة التنشيط.
    </p>
    <div style="display: flex; gap: 15px; justify-content: center;">
        <a href="/" class="btn-neon" style="padding: 12px 28px; text-decoration: none;">🏠 العودة للرئيسية</a>
        <button onclick="location.reload()" class="btn-neon success" style="padding: 12px 28px; background: transparent; border-radius: 8px;">🔄 إعادة المحاولة</button>
    </div>
</div>
{% endblock %}
