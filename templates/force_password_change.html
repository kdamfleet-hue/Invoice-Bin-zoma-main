<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>اختيار كلمة مرور جديدة — BIN ZOMAH INTL.</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='base_styles.css', v=48) }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/page/force_password_change.css', v=1) }}">
</head>
<body>
  <main class="password-card">
    <h1>اختر كلمة مرور جديدة</h1>
    <p>مرحبًا {{ username }}. قبل متابعة استخدام النظام، يجب اختيار كلمة مرور خاصة بك. لا تشاركها مع أي شخص.</p>
    <form method="post" autocomplete="off">
      <label for="new_password">كلمة المرور الجديدة</label>
      <input id="new_password" name="new_password" type="password" minlength="12" required autocomplete="new-password">
      <label for="confirm_password">تأكيد كلمة المرور</label>
      <input id="confirm_password" name="confirm_password" type="password" minlength="12" required autocomplete="new-password">
      <div class="rules">يجب أن تكون 12 حرفًا على الأقل، وتحتوي على حرف كبير وحرف صغير ورقم، ولا تكون مطابقة لكلمة المرور السابقة.</div>
      {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
      <button type="submit">حفظ كلمة المرور والمتابعة</button>
    </form>
    <a class="logout" href="{{ url_for('auth.logout') }}">تسجيل الخروج</a>
  </main>
</body>
</html>
