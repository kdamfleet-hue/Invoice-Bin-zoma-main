<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>اختيار كلمة مرور جديدة — BIN ZOMAH INTL.</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='base_styles.css', v=48) }}">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; background: #071018; color: #f8fafc; font-family: Cairo, Arial, sans-serif; }
    .password-card { width: min(100%, 520px); padding: 32px; border: 1px solid rgba(197,160,89,.35); border-radius: 18px; background: #101b27; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
    h1 { margin: 0 0 10px; color: #d8b36b; font-size: 1.55rem; }
    p { color: #b8c3d1; line-height: 1.8; }
    label { display: block; margin: 18px 0 7px; font-weight: 700; }
    input { width: 100%; box-sizing: border-box; padding: 12px 14px; border: 1px solid #405064; border-radius: 10px; background: #0b141e; color: #fff; font: inherit; }
    input:focus { outline: 2px solid #d8b36b; outline-offset: 2px; }
    button { width: 100%; margin-top: 24px; padding: 13px; border: 0; border-radius: 10px; background: #d8b36b; color: #071018; font: inherit; font-weight: 800; cursor: pointer; }
    .rules { margin-top: 18px; padding: 12px 16px; border-radius: 10px; background: rgba(255,255,255,.05); color: #c7d0dc; font-size: .9rem; }
    .error { margin-top: 16px; padding: 10px 12px; border: 1px solid rgba(239,131,124,.55); border-radius: 9px; background: rgba(239,131,124,.12); color: #ffc0b8; }
    .logout { display: block; margin-top: 16px; text-align: center; color: #b8c3d1; }
  </style>
</head>
<body>
  <main class="password-card">
    <h1>اختر كلمة مرور جديدة</h1>
    <p>مرحبًا {{ username }}. قبل متابعة استخدام النظام، يجب اختيار كلمة مرور خاصة بك. لا تشاركها مع أي شخص.</p>
    <form method="post" autocomplete="off">
      <label for="new_password">كلمة المرور الجديدة</label>
      <input id="new_password" name="new_password" type="password" minlength="12" required autocomplete="new-password">
      <label for="confirm_password">تأكيد كلمة المرور</label>
      <input id="confirm_password" name="confirm_password" type="password" minlength="12" required autocomplete="new-password">
      <div class="rules">يجب أن تكون 12 حرفًا على الأقل، وتحتوي على حرف كبير وحرف صغير ورقم، ولا تكون مطابقة لكلمة المرور السابقة.</div>
      {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
      <button type="submit">حفظ كلمة المرور والمتابعة</button>
    </form>
    <a class="logout" href="{{ url_for('auth.logout') }}">تسجيل الخروج</a>
  </main>
</body>
</html>
