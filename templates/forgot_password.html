<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نسيت كلمة المرور — BIN ZOMAH INTL.</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='base_styles.css', v=31) }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/page/forgot_password.css', v=1) }}">
</head>
<body>
  <main class="card">
    <h1>نسيت كلمة المرور؟</h1>
    <p>أدخل اسم المستخدم أو البريد الإلكتروني المسجل. إذا كان الحساب موجودًا وله بريد صالح، سنرسل رابطًا مؤقتًا لإعادة تعيين كلمة المرور.</p>
    <form method="post" autocomplete="off">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="identifier">اسم المستخدم أو البريد الإلكتروني</label>
      <input id="identifier" name="identifier" type="text" required maxlength="255" autocomplete="username">
      <button type="submit">إرسال رابط الاستعادة</button>
    </form>
    {% if message %}<div class="notice" role="status">{{ message }}</div>{% endif %}
    <a href="{{ url_for('auth.login') }}">العودة إلى تسجيل الدخول</a>
  </main>
</body>
</html>
