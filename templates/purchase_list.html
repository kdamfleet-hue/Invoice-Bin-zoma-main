{% extends 'base.html' %}
{% block title %}قائمة طلبات الشراء{% endblock %}
{% block page_heading %}طلبات الشراء حسب الرقم التسلسلي{% endblock %}
{% block content %}
<div class="glass-panel csp-inline-purchase-list-1514">
  <div class="csp-inline-purchase-list-1515">
    <a class="bz-chip" href="/purchase">+ طلب جديد</a>
    <input id="q" placeholder="بحث بالرقم التسلسلي أو اللوحة أو السائق" oninput="draw()" class="csp-inline-purchase-list-1516">
  </div>
  <div class="table-responsive">
    <table class="sched csp-inline-purchase-list-1517">
      <thead><tr><th>التسلسلي</th><th>التاريخ</th><th>اللوحة</th><th>السائق</th><th>الكفرات</th><th>البطاريات</th><th>القطع</th><th>إجراء</th></tr></thead>
      <tbody id="tb"></tbody>
    </table>
  </div>
</div>
<script>
function load(){
  try{return JSON.parse(localStorage.getItem('poArchive')||'[]');}catch(e){return [];}
}
function draw(){
  const q=(document.getElementById('q').value||'').trim();
  const rows=load().filter(p=>!q || [p.serial,p.plate,p.driver].join(' ').includes(q));
  document.getElementById('tb').innerHTML=rows.map(p=>`<tr>
    <td class="csp-inline-purchase-list-1518">${p.serial||'—'}</td>
    <td>${p.date||''}</td>
    <td>${p.plate||''}</td>
    <td>${p.driver||''}</td>
    <td>${(p.tires||[]).length}</td>
    <td>${(p.batteries||[]).length}</td>
    <td>${(p.parts||[]).length}</td>
    <td>
      <a href="/purchase?serial=${encodeURIComponent(p.serial||'')}">فتح</a>
      · <a href="/inventory/tires?po=${encodeURIComponent(p.serial||'')}">كفرات</a>
      · <a href="/inventory/batteries?po=${encodeURIComponent(p.serial||'')}">بطاريات</a>
      · <a href="/spare_parts?po=${encodeURIComponent(p.serial||'')}">قطع</a>
    </td>
  </tr>`).join('') || '<tr><td colspan="8">لا توجد طلبات محفوظة بعد</td></tr>';
}
draw();
</script>
{% endblock %}
