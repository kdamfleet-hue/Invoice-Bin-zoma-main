<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إعادة تعيين كلمة المرور — BIN ZOMAH INTL.</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='base_styles.css', v=31) }}">
  <style>
    body { min-height:100vh; display:grid; place-items:center; margin:0; padding:24px; background:linear-gradient(135deg,#0c2340,#16335c); font-family:inherit; }
    .card { width:min(100%,460px); padding:34px; border-radius:20px; background:#fff; box-shadow:0 22px 60px rgba(0,0,0,.35); }
    h1 { margin:0 0 10px; color:#0c2340; font-size:1.6rem; }
    p { color:#475569; line-height:1.7; }
    label { display:block; margin:20px 0 7px; color:#0c2340; font-weight:700; }
    input { width:100%; box-sizing:border-box; padding:13px; border:1px solid #cbd5e1; border-radius:10px; font:inherit; }
    button { width:100%; margin-top:22px; padding:13px; border:0; border-radius:10px; color:#fff; background:#0c2340; font:inherit; font-weight:800; cursor:pointer; }
    .error { margin-top:18px; padding:12px; border-radius:10px; color:#991b1b; background:#fef2f2; border:1px solid #fecaca; line-height:1.6; }
    .hint { font-size:.9rem; color:#64748b; }
    a { display:inline-block; margin-top:20px; color:#0c2340; font-weight:700; }
  </style>
</head>
<body>
  <main class="card">
    <h1>اختيار كلمة مرور جديدة</h1>
    {% if token %}
    <p class="hint">يجب أن تتكون كلمة المرور من 12 حرفًا على الأقل، وتتضمن حرفًا كبيرًا وحرفًا صغيرًا ورقمًا.</p>
    <form method="post" autocomplete="off">
      <label for="new_password">كلمة المرور الجديدة</label>
      <input id="new_password" name="new_password" type="password" minlength="12" required autocomplete="new-password">
      <label for="confirm_password">تأكيد كلمة المرور</label>
      <input id="confirm_password" name="confirm_password" type="password" minlength="12" required autocomplete="new-password">
      <button type="submit">حفظ كلمة المرور</button>
    </form>
    {% endif %}
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    <a href="{{ url_for('auth.login') }}">العودة إلى تسجيل الدخول</a>
  </main>
</body>
</html>
