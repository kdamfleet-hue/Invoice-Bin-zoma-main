<!doctype html>
<html lang="ar" dir="rtl" id="rootHtml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}KM المتكامل{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --navy:#08131f;--ink:#152433;--gold:#c6a056;--gold-s:#ead7a4;
      --muted:#6a7b8c;--bg:#f4f6f8;--card:#fff;--line:#e3e8ee;--ok:#0e7a58;--danger:#b3261e;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;line-height:1.8}
    a{color:inherit;text-decoration:none}
    .shell{max-width:1140px;margin:auto;padding:0 24px}
    .top{position:sticky;top:0;z-index:30;background:rgba(8,19,31,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.06)}
    .nav{height:76px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{display:flex;align-items:center;gap:12px;color:#fff}
    .mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(160deg,#c6a056,#ead7a4);color:#08131f;display:grid;place-items:center;font-weight:700;letter-spacing:.4px;animation:markIn .7s cubic-bezier(.2,1.4,.3,1) both,markGlow 2.8s ease-in-out 1s infinite}
    @keyframes markIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
    @keyframes markGlow{0%,100%{box-shadow:none}50%{box-shadow:0 0 0 6px rgba(198,160,86,.18)}}
    .brand b{display:block;font-size:17px;font-weight:700}
    .brand small{display:block;color:#9aadb8;font-size:11px;font-weight:500}
    .navlinks{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .navlinks a,.lang-btn{color:#d5e0e8;padding:8px 12px;border-radius:8px;font-size:14px}
    .navlinks a:hover{background:rgba(255,255,255,.06)}
    .lang-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);cursor:pointer;font:inherit;color:#ead7a4}
    .btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:10px;padding:11px 18px;background:#1d4f7a;color:#fff;font-weight:600;cursor:pointer;font:inherit}
    .btn.gold{background:linear-gradient(160deg,#c6a056,#d8b56a);color:#08131f}
    .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.16);color:#fff}
    .btn.full{width:100%}
    .hero{padding:92px 0 84px;color:#fff;background:
      radial-gradient(720px 320px at 85% 0%,rgba(198,160,86,.18),transparent 55%),
      linear-gradient(165deg,#08131f 0%,#102536 100%)}
    .hero-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:56px;align-items:center}
    .eyebrow{color:var(--gold-s);font-size:13px;font-weight:600;letter-spacing:.6px}
    h1{font-size:46px;line-height:1.22;margin:14px 0 16px;font-weight:700;letter-spacing:-.4px}
    .hero p{color:#c5d4de;font-size:18px;max-width:560px}
    .cta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
    .panel{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:28px;min-height:320px}
    .section{padding:76px 0}
    .section h2{font-size:30px;margin:8px 0 12px}
    .muted{color:var(--muted)}
    .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}
    .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px}
    .card h3{margin:0 0 8px;font-size:18px}
    .footer{padding:26px 0;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
    .foot-row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .modal{position:fixed;inset:0;background:rgba(6,12,20,.72);display:none;align-items:center;justify-content:center;padding:24px;z-index:80;backdrop-filter:blur(10px)}
    .modal.open{display:flex;animation:fadeIn .25s ease}
    .modal-box{width:min(920px,100%);background:#08131f;border:1px solid rgba(198,160,86,.28);border-radius:22px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45);animation:popIn .35s cubic-bezier(.2,1.2,.3,1)}
    .modal-bar{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;color:#ead7a4;border-bottom:1px solid rgba(255,255,255,.08)}
    .modal-x{background:transparent;border:0;color:#fff;font-size:22px;cursor:pointer}
    .modal-stage{position:relative;min-height:360px;background:#050b12;display:grid;place-items:center}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes popIn{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
    @media(max-width:900px){
      .hero-grid,.grid3{grid-template-columns:1fr}
      h1{font-size:32px}
    }
  </style>
</head>
<body>
<header class="top">
  <div class="shell nav">
    <a class="brand" href="{{ url_for('saas.landing') }}">
      <span class="mark">KM</span>
      <span><b data-ar="المتكامل" data-en="Al-Mutakamil">المتكامل</b><small data-ar="خالد بن محمد الغامدي" data-en="Khaled bin Mohammed Al-Ghamdi">خالد بن محمد الغامدي</small></span>
    </a>
    <nav class="navlinks">
      <button class="lang-btn" id="langBtn" type="button">EN</button>
      <a href="{{ url_for('saas.highlights') }}" data-ar="المزايا" data-en="Features">المزايا</a>
      <a href="{{ url_for('saas.plans') }}" data-ar="الباقات" data-en="Plans">الباقات</a>
      {% if session.get('authenticated') and session.get('company_id') %}
      <a href="{{ url_for('dashboard.index') }}" data-ar="الحساب" data-en="Account">الحساب</a>
      {% else %}
      <a href="{{ url_for('saas.company_login') }}" data-ar="دخول" data-en="Sign in">دخول</a>
      {% endif %}
      <a class="btn gold" href="{{ url_for('saas.register_company') }}" data-ar="ابدأ مجانًا" data-en="Start free">ابدأ مجانًا</a>
    </nav>
  </div>
</header>
{% block content %}{% endblock %}
<footer class="footer"><div class="shell foot-row"><span data-ar="© 2026 خالد بن محمد الغامدي" data-en="© 2026 Khaled bin Mohammed Al-Ghamdi">© 2026 خالد بن محمد الغامدي</span><span>KM</span></div></footer>
<div class="modal" id="clipModal" aria-hidden="true">
  <div class="modal-box">
    <div class="modal-bar">
      <strong data-ar="شعار KM المتحرك" data-en="KM animated mark">شعار KM المتحرك</strong>
      <button class="modal-x" type="button" id="clipClose">×</button>
    </div>
    <div class="modal-stage" id="clipStage"></div>
  </div>
</div>
<script>
(function(){
  var html=document.getElementById('rootHtml');
  var btn=document.getElementById('langBtn');
  function apply(lang){
    var en = lang==='en';
    html.lang = en ? 'en' : 'ar';
    html.dir = en ? 'ltr' : 'rtl';
    document.querySelectorAll('[data-ar]').forEach(function(el){
      el.textContent = en ? (el.getAttribute('data-en')||el.textContent) : (el.getAttribute('data-ar')||el.textContent);
    });
    if(btn) btn.textContent = en ? 'AR' : 'EN';
    localStorage.setItem('km_lang', en ? 'en' : 'ar');
  }
  apply(localStorage.getItem('km_lang')||'ar');
  if(btn) btn.onclick=function(){ apply(html.lang==='ar'?'en':'ar'); };

  window.KM_openClip=function(){
    var m=document.getElementById('clipModal');
    var s=document.getElementById('clipStage');
    if(!m||!s) return;
    s.innerHTML='<div class="km-live"><div class="km-box">KM</div><p>المتكامل</p></div>';
    var v=document.createElement('video');
    v.autoplay=true; v.muted=true; v.loop=true; v.playsInline=true; v.controls=true;
    v.style.cssText='width:100%;max-height:70vh;display:block;background:#000';
    v.src='{{ url_for("static", filename="saas/km_logo.mp4") }}';
    v.onloadeddata=function(){ s.innerHTML=''; s.appendChild(v); v.play().catch(function(){}); };
    m.classList.add('open'); m.setAttribute('aria-hidden','false');
  };
  var close=document.getElementById('clipClose');
  var modal=document.getElementById('clipModal');
  if(close) close.onclick=function(){ modal.classList.remove('open'); };
  if(modal) modal.addEventListener('click', function(e){ if(e.target===modal) modal.classList.remove('open'); });
})();
</script>
<style>
  .km-live{text-align:center;color:#ead7a4;padding:48px 16px}
  .km-box{width:120px;height:120px;margin:0 auto 16px;border-radius:28px;display:grid;place-items:center;font-size:42px;font-weight:800;color:#08131f;background:linear-gradient(160deg,#c6a056,#ead7a4);animation:popIn .5s cubic-bezier(.2,1.4,.3,1), markGlow 2.4s ease-in-out .4s infinite}
</style>
</body>
</html>
