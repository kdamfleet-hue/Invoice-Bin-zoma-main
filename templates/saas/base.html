<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}KM المتكامل{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --navy:#071525;--ink:#102033;--blue:#1a6fb5;--gold:#d4a24a;--gold-2:#f0d08a;
      --muted:#6b7c8f;--bg:#f3f6fb;--card:#fff;--line:#dbe4ee;--ok:#0f8a62;--danger:#b42318;
      --glass:rgba(255,255,255,.08);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,Arial,sans-serif;line-height:1.75}
    a{color:inherit}
    .shell{max-width:1180px;margin:auto;padding:0 24px}
    .top{position:sticky;top:0;z-index:40;background:rgba(7,21,37,.88);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.06)}
    .nav{height:78px;display:flex;align-items:center;justify-content:space-between}
    .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff}
    .mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#d4a24a,#f3d48a);display:grid;place-items:center;color:#071525;font-weight:900;box-shadow:0 8px 20px #d4a24a44}
    .brand b{display:block;font-size:18px;letter-spacing:.2px}
    .brand small{display:block;color:#9cb0c4;font-size:11px;font-weight:500}
    .navlinks{display:flex;gap:8px;align-items:center}
    .navlinks a{color:#d7e6f4;text-decoration:none;padding:8px 12px;border-radius:10px}
    .navlinks a:hover{background:rgba(255,255,255,.06)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;background:var(--blue);color:#fff;text-decoration:none;font-weight:800;cursor:pointer;transition:.2s ease}
    .btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
    .btn.gold{background:linear-gradient(135deg,#d4a24a,#e8c36a);color:#071525}
    .btn.light{background:#edf5ff;color:#1769aa}
    .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.18);color:#fff}
    .btn.full{width:100%}
    .hero{position:relative;overflow:hidden;padding:88px 0 78px;background:
      radial-gradient(900px 420px at 90% -10%,rgba(212,162,74,.22),transparent 50%),
      radial-gradient(700px 380px at 0% 110%,rgba(26,111,181,.28),transparent 45%),
      linear-gradient(160deg,#06111d 0%,#0c2740 58%,#12324c 100%);color:#fff}
    .hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:46px 46px;mask-image:linear-gradient(#000,transparent 88%);pointer-events:none}
    .hero-grid{position:relative;display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
    .eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--gold-2);font-weight:800;letter-spacing:.3px}
    .hero h1,.auth-copy h1,h1{font-size:48px;line-height:1.18;margin:12px 0 16px;font-weight:900}
    .hero p{color:#d5e6f5;font-size:18px;max-width:640px}
    .cta-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
    .trust{display:flex;gap:22px;flex-wrap:wrap;margin-top:28px;color:#9cb4c8;font-size:13px}
    .trust span{display:flex;align-items:center;gap:7px}
    .hero-card,.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 18px 50px #102a4310}
    .hero-visual{position:relative;min-height:420px}
    .glass-panel{position:absolute;inset:18px 0 0;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.14);border-radius:28px;backdrop-filter:blur(16px);padding:22px;box-shadow:0 30px 80px #0006}
    .pulse{position:absolute;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(212,162,74,.35),transparent 70%);right:-20px;top:-20px;animation:float 6s ease-in-out infinite}
    .mini{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .mini b{display:block;font-size:22px;color:#fff}
    .chip{background:rgba(7,21,37,.35);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px;color:#eaf3fb}
    .chip small{color:#9cb4c8}
    .section{padding:72px 0}
    .section h2{font-size:32px;margin:0 0 10px}
    .muted{color:var(--muted)}
    .features,.plans,.stats,.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .feature,.step-card{transition:.25s ease}
    .feature:hover,.step-card:hover,.plan-card:hover{transform:translateY(-4px);box-shadow:0 22px 50px #12324c14}
    .icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#edf5ff;color:#1769aa;font-weight:900;margin-bottom:10px}
    .price{font-size:42px;color:var(--navy);font-weight:900}
    .price span{font-size:14px;color:var(--muted);font-weight:600}
    .form-wrap{max-width:1120px;margin:48px auto 70px}
    .auth-grid{display:grid;grid-template-columns:.92fr 1.08fr;gap:28px;align-items:stretch}
    .auth-side{position:relative;overflow:hidden;border-radius:28px;min-height:560px;padding:36px;color:#fff;background:
      radial-gradient(500px 240px at 100% 0%,rgba(212,162,74,.28),transparent 50%),
      linear-gradient(165deg,#071525,#12324c)}
    .auth-side h2{font-size:34px;margin:12px 0 10px}
    .path{display:flex;flex-direction:column;gap:12px;margin-top:28px}
    .path div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px 16px}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
    .field{display:flex;flex-direction:column;gap:6px}
    .field.full{grid-column:1/-1}
    .field label{font-weight:800;font-size:13px}
    .field input,.field textarea,.field select{border:1px solid #ced8e4;border-radius:12px;padding:13px 14px;font:inherit;background:#fff;outline:none;transition:.2s}
    .field input:focus{border-color:#1a6fb5;box-shadow:0 0 0 4px #1a6fb51f}
    .notice{padding:12px 15px;border-radius:12px;margin:14px 0;background:#eef8f4;color:var(--ok)}
    .error{padding:12px 15px;border-radius:12px;margin:14px 0;background:#fff1f0;color:var(--danger)}
    .dash{padding:36px 0 70px}
    .dash-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:16px}
    .stats{grid-template-columns:repeat(4,1fr)}
    .stat strong{display:block;font-size:30px;color:var(--navy)}
    .footer{padding:28px 0;color:var(--muted);border-top:1px solid var(--line)}
    .foot-row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(12px)}}
    @media(max-width:900px){
      .hero-grid,.auth-grid,.features,.plans,.stats,.steps,.form-grid{grid-template-columns:1fr}
      .hero h1,.auth-copy h1{font-size:34px}
      .hero-visual,.auth-side{min-height:auto;position:relative}
      .glass-panel{position:relative;inset:auto}
      .navlinks{gap:4px;font-size:13px}
      .dash-head{display:block}
    }
  </style>
</head>
<body>
<header class="top">
  <div class="shell nav">
    <a class="brand" href="{{ url_for('saas.landing') }}">
      <span class="mark">KM</span>
      <span><b>المتكامل</b><small>منصة تشغيل الأساطيل</small></span>
    </a>
    <nav class="navlinks">
      <a href="{{ url_for('saas.plans') }}">الباقات</a>
      {% if session.get('authenticated') and session.get('company_id') %}
      <a href="{{ url_for('dashboard.index') }}">الموقع المعزول</a>
      {% else %}
      <a href="{{ url_for('saas.company_login') }}">دخول</a>
      {% endif %}
      <a class="btn gold" href="{{ url_for('saas.register_company') }}">ابدأ الآن</a>
    </nav>
  </div>
</header>
{% block content %}{% endblock %}
<footer class="footer"><div class="shell foot-row"><span>© 2026 KM المتكامل · تشغيل احترافي للأسطول</span><span>مساحة شركة مستقلة · دخول منفصل · موقع معزول</span></div></footer>
</body>
</html>
