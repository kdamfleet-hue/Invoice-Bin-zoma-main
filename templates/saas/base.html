<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Bin Zomah SaaS{% endblock %}</title>
  <style>
    :root{--navy:#0b1f33;--blue:#1769aa;--gold:#c9953d;--ink:#1c2b39;--muted:#64748b;--bg:#f5f7fb;--card:#fff;--line:#e4eaf1;--ok:#087f5b;--danger:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif;line-height:1.7}.shell{max-width:1180px;margin:auto;padding:0 24px}.top{background:var(--navy);color:#fff}.nav{height:76px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;letter-spacing:.3px;font-size:20px}.brand small{display:block;color:#b9c9d9;font-size:11px;font-weight:400}.navlinks{display:flex;gap:18px;align-items:center}.nav a{color:#dbeafe;text-decoration:none}.btn{display:inline-block;border:0;border-radius:10px;padding:11px 18px;background:var(--blue);color:#fff;text-decoration:none;font-weight:700;cursor:pointer}.btn.gold{background:var(--gold);color:var(--navy)}.btn.light{background:#edf5ff;color:var(--blue)}.btn.danger{background:#fff0f0;color:var(--danger)}.hero{padding:82px 0 70px;background:linear-gradient(135deg,#0b1f33 0%,#164f75 100%);color:#fff}.hero-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:50px;align-items:center}.eyebrow{color:#f2c66d;font-weight:700}.hero h1{font-size:46px;line-height:1.2;margin:14px 0}.hero p{color:#dbeafe;font-size:18px;max-width:680px}.hero-card,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:25px;box-shadow:0 12px 35px #102a4312}.hero-card{color:var(--ink)}.section{padding:62px 0}.section h2{font-size:30px;margin:0 0 12px}.muted{color:var(--muted)}.features,.plans,.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.feature h3{margin:4px 0}.price{font-size:38px;color:var(--navy);font-weight:800}.price span{font-size:14px;color:var(--muted);font-weight:400}.form-wrap{max-width:720px;margin:55px auto}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-weight:700;font-size:14px}.field input,.field textarea,.field select{border:1px solid #ced8e4;border-radius:9px;padding:12px;font:inherit;background:#fff}.notice{padding:12px 15px;border-radius:9px;margin:14px 0;background:#eef8f4;color:var(--ok)}.error{padding:12px 15px;border-radius:9px;margin:14px 0;background:#fff1f0;color:var(--danger)}.dash{padding:36px 0}.dash-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.stats{grid-template-columns:repeat(4,1fr)}.stat strong{display:block;font-size:30px;color:var(--navy)}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;background:#fff}.table th,.table td{padding:13px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}.table th{color:var(--muted);font-size:13px}.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;background:#edf5ff;color:var(--blue)}.badge.ok{background:#e9f8f1;color:var(--ok)}.badge.warn{background:#fff7e6;color:#996b00}.footer{padding:30px 0;color:var(--muted);border-top:1px solid var(--line);margin-top:50px}@media(max-width:760px){.hero-grid,.features,.plans,.stats,.form-grid{grid-template-columns:1fr}.hero h1{font-size:34px}.navlinks{gap:8px;font-size:12px}.dash-head{display:block}}
  </style>
</head>
<body>
<header class="top"><div class="shell nav"><a class="brand" href="{{ url_for('saas.landing') }}">BIN ZOMAH <small>Fleet SaaS</small></a><nav class="navlinks"><a href="{{ url_for('saas.plans') }}">الباقات</a>{% if session.get('authenticated') and session.get('company_id') %}<a href="{{ url_for('saas.workspace') }}">لوحتي</a>{% else %}<a href="{{ url_for('auth.login') }}">دخول</a>{% endif %}<a class="btn gold" href="{{ url_for('saas.register_company') }}">ابدأ مجانًا</a></nav></div></header>
{% block content %}{% endblock %}
<footer class="footer"><div class="shell">© 2026 Bin Zomah Fleet SaaS · إدارة الأسطول باحترافية</div></footer>
</body></html>
