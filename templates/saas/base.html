<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}KM المتكامل{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --navy:#08131f;--ink:#152433;--gold:#c6a056;--gold-s:#ead7a4;
      --muted:#6a7b8c;--bg:#f4f6f8;--card:#fff;--line:#e3e8ee;--ok:#0e7a58;--danger:#b3261e;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;line-height:1.8}
    a{color:inherit;text-decoration:none}
    .shell{max-width:1140px;margin:auto;padding:0 24px}
    .top{position:sticky;top:0;z-index:30;background:rgba(8,19,31,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.06)}
    .nav{height:76px;display:flex;align-items:center;justify-content:space-between}
    .brand{display:flex;align-items:center;gap:12px;color:#fff}
    .mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(160deg,#c6a056,#ead7a4);color:#08131f;display:grid;place-items:center;font-weight:700;letter-spacing:.4px;animation:markIn .7s cubic-bezier(.2,1.4,.3,1) both,markGlow 2.8s ease-in-out 1s infinite}
    @keyframes markIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
    @keyframes markGlow{0%,100%{box-shadow:none}50%{box-shadow:0 0 0 6px rgba(198,160,86,.18)}}
    .brand b{display:block;font-size:17px;font-weight:700}
    .brand small{display:block;color:#9aadb8;font-size:11px;font-weight:500}
    .navlinks{display:flex;align-items:center;gap:6px}
    .navlinks a{color:#d5e0e8;padding:8px 12px;border-radius:8px;font-size:14px}
    .navlinks a:hover{background:rgba(255,255,255,.06)}
    .btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:10px;padding:11px 18px;background:#1d4f7a;color:#fff;font-weight:600;cursor:pointer;font:inherit}
    .btn.gold{background:linear-gradient(160deg,#c6a056,#d8b56a);color:#08131f}
    .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.16);color:#fff}
    .btn.full{width:100%}
    .hero{padding:92px 0 84px;color:#fff;background:
      radial-gradient(720px 320px at 85% 0%,rgba(198,160,86,.18),transparent 55%),
      linear-gradient(165deg,#08131f 0%,#102536 100%)}
    .hero-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:56px;align-items:center}
    .eyebrow{color:var(--gold-s);font-size:13px;font-weight:600;letter-spacing:.6px}
    h1{font-size:46px;line-height:1.22;margin:14px 0 16px;font-weight:700;letter-spacing:-.4px}
    .hero p{color:#c5d4de;font-size:18px;max-width:560px}
    .cta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
    .panel{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:28px;min-height:320px}
    .panel h3{margin:8px 0 18px;font-size:22px}
    .quote{color:#d7e2ea;font-size:16px}
    .meta{margin-top:28px;color:#9eb0bc;font-size:13px}
    .section{padding:76px 0}
    .section h2{font-size:30px;margin:8px 0 12px}
    .muted{color:var(--muted)}
    .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}
    .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px}
    .card h3{margin:0 0 8px;font-size:18px}
    .price{font-size:40px;font-weight:700;color:var(--navy)}
    .price span{font-size:14px;color:var(--muted);font-weight:500}
    .form-wrap{max-width:1080px;margin:56px auto 80px}
    .auth-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:24px}
    .auth-side{border-radius:24px;padding:40px;color:#fff;background:linear-gradient(165deg,#08131f,#163044)}
    .auth-side h2{font-size:32px;margin:12px 0 10px;line-height:1.3}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .field{display:flex;flex-direction:column;gap:6px}
    .field.full{grid-column:1/-1}
    .field label{font-size:13px;font-weight:600}
    .field input{border:1px solid #d5dee6;border-radius:10px;padding:12px 13px;font:inherit;background:#fff}
    .field input:focus{outline:2px solid #c6a05655;border-color:#c6a056}
    .error{background:#fdecea;color:var(--danger);padding:12px 14px;border-radius:10px;margin:12px 0}
    .dash{padding:40px 0 80px}
    .dash-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:24px}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
    .stat strong{display:block;font-size:28px;color:var(--navy)}
    .footer{padding:26px 0;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
    .foot-row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
    @media(max-width:900px){
      .hero-grid,.auth-grid,.grid3,.stats,.form-grid{grid-template-columns:1fr}
      h1{font-size:32px}
      .dash-head{display:block}
    }
  </style>
</head>
<body>
<header class="top">
  <div class="shell nav">
    <a class="brand" href="{{ url_for('saas.landing') }}">
      <span class="mark">KM</span>
      <span><b>المتكامل</b><small>خالد بن محمد الغامدي</small></span>
    </a>
    <nav class="navlinks">
      <a href="{{ url_for('saas.highlights') }}">المزايا</a>
      <a href="{{ url_for('saas.plans') }}">الباقات</a>
      {% if session.get('authenticated') and session.get('company_id') %}
      <a href="{{ url_for('dashboard.index') }}">الحساب</a>
      {% else %}
      <a href="{{ url_for('saas.company_login') }}">دخول</a>
      {% endif %}
      <a class="btn gold" href="{{ url_for('saas.register_company') }}">ابدأ مجانًا</a>
    </nav>
  </div>
</header>
{% block content %}{% endblock %}
<footer class="footer"><div class="shell foot-row"><span>© 2026 خالد بن محمد الغامدي</span><span>KM المتكامل</span></div></footer>
</body>
</html>
