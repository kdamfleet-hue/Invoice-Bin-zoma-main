<!doctype html>
<html lang="ar" dir="rtl" id="rootHtml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}KM المتكامل{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/saas.css', v='1') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth_identity.css', v='1') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
<header class="top">
  <div class="shell nav">
    <a class="brand" href="{{ url_for('saas.landing') }}">
      <span class="mark">KM</span>
      <span><b data-ar="المتكامل" data-en="Al-Mutakamil">المتكامل</b><small data-ar="خالد بن محمد الغامدي" data-en="Khaled bin Mohammed Al-Ghamdi">خالد بن محمد الغامدي</small></span>
    </a>
    <nav class="navlinks">
      <button class="lang-btn" id="langBtn" type="button">EN</button>
      <button class="lang-btn" type="button" data-km-clip-open data-ar="المقطع" data-en="Clip">المقطع</button>
      <a href="{{ url_for('saas.highlights') }}" data-ar="المزايا" data-en="Features">المزايا</a>
      <a href="{{ url_for('saas.plans') }}" data-ar="الباقات" data-en="Plans">الباقات</a>
      <a class="btn ghost" href="{{ url_for('saas.workspace') }}" data-ar="مشترك" data-en="Subscriber">مشترك</a>
      <a href="{{ url_for('auth.login') }}" data-ar="بوابة بن زومة" data-en="Bin Zomah portal">بوابة بن زومة</a>
      {% if session.get('authenticated') and session.get('company_id') %}
      <a href="{{ url_for('dashboard.index') }}" data-ar="الحساب" data-en="Account">الحساب</a>
      {% else %}
      <a href="{{ url_for('saas.company_login') }}" data-ar="دخول" data-en="Sign in">دخول</a>
      {% endif %}
      <a class="btn gold" href="{{ url_for('saas.register_company') }}" data-ar="ابدأ مجانًا" data-en="Start free">ابدأ مجانًا</a>
    </nav>
  </div>
</header>
{% block content %}{% endblock %}
<footer class="footer"><div class="shell foot-row"><span data-ar="© 2026 خالد بن محمد الغامدي" data-en="© 2026 Khaled bin Mohammed Al-Ghamdi">© 2026 خالد بن محمد الغامدي</span><span>KM</span></div></footer>
<div class="modal" id="clipModal" aria-hidden="true">
  <div class="modal-box">
    <div class="modal-bar">
      <strong data-ar="المقطع" data-en="Clip">المقطع</strong>
      <button class="modal-x" type="button" id="clipClose">×</button>
    </div>
    <div class="modal-stage">
      <video id="clipVid" controls playsinline muted loop preload="metadata" src="{{ url_for('static', filename='km_clip.mp4') }}"></video>
    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='js/saas.js', v='1') }}" defer></script>
</body>
</html>
