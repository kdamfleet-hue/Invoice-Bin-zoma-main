{% extends 'saas/base.html' %}{% block title %}تسجيل شركة جديدة{% endblock %}{% block content %}<div class="shell form-wrap"><div class="card"><div class="eyebrow">ابدأ مجانًا لمدة 14 يومًا</div><h1>أنشئ مساحة شركتك</h1><p class="muted">بعد التسجيل سننشئ حساب المدير ونفتح لوحة التحكم مباشرة.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><div class="field full"><label>اسم الشركة</label><input name="company_name" value="{{ form.company_name if form else '' }}" required maxlength="180" placeholder="مثال: شركة بن زومة للنقل"></div><div class="field"><label>اسم المسؤول</label><input name="owner_name" value="{{ form.owner_name if form else '' }}" required maxlength="150"></div><div class="field"><label>رقم الجوال</label><input name="phone" value="{{ form.phone if form else '' }}" required maxlength="30" type="tel"></div><div class="field full"><label>البريد الإلكتروني</label><input name="email" value="{{ form.email if form else '' }}" required maxlength="255" type="email"></div><div class="field"><label>كلمة المرور</label><input name="password" required minlength="12" type="password"><small class="muted">12 حرفًا، حرف كبير وصغير ورقم.</small></div><div class="field"><label>تأكيد كلمة المرور</label><input name="password_confirmation" required minlength="12" type="password"></div></div><button class="btn" style="margin-top:22px" type="submit">إنشاء الشركة وبدء التجربة</button></form></div></div>{% endblock %}
