{% extends 'base.html' %}

{% block title %}تبويب مقفل — BIN ZOMAH INTL.{% endblock %}

{% block head %}
<meta id="bz-meta" data-branch-id="{{ active_branch_id }}" data-branch="{{ active_branch }}" data-snap-tab="{{ snap_tab }}">
<script>
  const m = document.getElementById("bz-meta");
  if(m) {
      window.BZ_BRANCH_ID = parseInt(m.getAttribute("data-branch-id") || "0", 10);
      window.BZ_BRANCH = m.getAttribute("data-branch") || "";
      window.BZ_SNAP_TAB = m.getAttribute("data-snap-tab") || "";
  }
</script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/page/tab_lock.css', v=1) }}">
{% endblock %}

{% block content %}
<div class="login-card glass-surface">
<div class="lock-ico">🔒</div>
<h2>تبويب مقفل</h2>
<div class="brand-line">BIN ZOMAH INTL.</div>
<p class="subtitle">هذا التبويب محمي. أدخل كلمة المرور للمتابعة.</p>
<form action="{{ action or '/importantworkstation/unlock' }}" class="login-form" method="POST">
<input name="next" type="hidden" value="{{ next }}"/>
<label for="password">كلمة المرور</label>
<input autocomplete="off" autofocus="" id="password" name="password" placeholder="أدخل كلمة المرور" required="" type="password"/>
<button class="btn-primary" type="submit">🔓 فتح القفل</button>
            {% if error %}
            <div class="login-error">{{ error }}</div>
            {% endif %}
        </form>
<a class="back-link" href="/">← العودة للرئيسية</a>
</div>
{% endblock %}
